services:
  pkkmb-presensi:
    build: .
    container_name: pkkmb-presensi
    restart: unless-stopped
    env_file: .env
    ports:
      # Hanya bind ke localhost STB — TIDAK expose ke jaringan luar
      # langsung. Akses publik lewat cloudflared tunnel yang proxy ke
      # 127.0.0.1:3000, bukan lewat port ini secara langsung.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
